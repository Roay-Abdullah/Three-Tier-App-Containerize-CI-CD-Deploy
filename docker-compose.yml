version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: app_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/three-tier-app-backend:latest
    container_name: app_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/taskdb
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
    depends_on:
      - db
    restart: always

  frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/three-tier-app-frontend:latest
    container_name: app_frontend
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://${EC2_PUBLIC_IP}:5000   
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
