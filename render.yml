services:
  - type: web
    name: advanced-backend
    runtime: image
    repo: https://github.com/Roay-Abdullah/Three-Tier-App-Containerize-CI-CD-Deploy
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advanced-db
          property: connectionString
      - key: JWT_SECRET
        sync: false  
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    dockerfilePath: ./backend/Dockerfile
    preDeployCommand: cd backend && npx prisma migrate deploy

  - type: web
    name: advanced-frontend
    runtime: image
    repo: https://github.com/Roay-Abdullah/Three-Tier-App-Containerize-CI-CD-Deploy
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: advanced-backend
          type: web
          property: host
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npx serve -s dist -l 80
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
