name: Build, Push to ECR & Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- TESTS ----------
      - name: Backend tests
        run: |
          cd backend
          npm cache clean --force
          npm install --no-audit --no-fund

          # Wait for Postgres to be ready (max 30 seconds)
          echo "Waiting for Postgres..."
          for i in {1..30}; do
            if PGPASSWORD=testpass psql -h localhost -U postgres -c "SELECT 1" > /dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            sleep 1
          done
          
          npx prisma migrate deploy
          npm test
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres?schema=public

      - name: Frontend build check
        run: |
          cd frontend
          npm cache clean --force
          npm install --no-audit --no-fund
          npm run build

      # ---------- AWS LOGIN & ECR ----------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------- BUILD & PUSH BACKEND ----------
      - name: Build, tag, push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: three-tier-app-backend
          IMAGE_TAG: latest   # or ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # ---------- BUILD & PUSH FRONTEND ----------
      - name: Build, tag, push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: three-tier-app-frontend
          IMAGE_TAG: latest
        run: |
          cd frontend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # ---------- DEPLOY TO EC2 (SSH) ----------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            # Pull latest images from ECR
            docker-compose pull
            # Restart containers with new images
            docker-compose up -d --remove-orphans
            # Clean unused images
            docker image prune -f
